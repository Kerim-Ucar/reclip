plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.kerim'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = '25'
    modules = ['javafx.controls']
}

application {
    mainClass = 'com.kerim.reclip.app.ReclipApp'
    applicationDefaultJvmArgs = [
            '--enable-native-access=ALL-UNNAMED',
            '--enable-native-access=javafx.graphics'
    ]
}

dependencies {
    implementation 'com.github.kwhat:jnativehook:2.2.2'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('prepareJpackageInput', Sync) {
    dependsOn tasks.named('jar')
    from tasks.named('jar').get().archiveFile
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('jpackage-input')
}

tasks.register('packageMacApp', Exec) {
    dependsOn tasks.named('prepareJpackageInput')
    doFirst {
        def iconSource = file('Smoked-glass clipboard with curved arrow.png')
        def iconsetDir = layout.buildDirectory.dir('icon/Reclip.iconset').get().asFile
        def icnsFile = layout.buildDirectory.file('icon/Reclip.icns').get().asFile
        def distDir = layout.buildDirectory.dir('dist').get().asFile
        delete distDir
        iconsetDir.mkdirs()

        [16, 32, 128, 256, 512].each { size ->
            new ProcessBuilder('sips', '-z', "${size}", "${size}", iconSource.absolutePath,
                    '--out', new File(iconsetDir, "icon_${size}x${size}.png").absolutePath)
                    .inheritIO().start().waitFor()
            def retina = size * 2
            new ProcessBuilder('sips', '-z', "${retina}", "${retina}", iconSource.absolutePath,
                    '--out', new File(iconsetDir, "icon_${size}x${size}@2x.png").absolutePath)
                    .inheritIO().start().waitFor()
        }
        def iconResult = new ProcessBuilder('iconutil', '-c', 'icns', iconsetDir.absolutePath, '-o', icnsFile.absolutePath)
                .inheritIO().start().waitFor()
        if (iconResult != 0) {
            throw new GradleException("iconutil failed with exit code ${iconResult}")
        }
    }

    commandLine 'jpackage',
            '--type', 'app-image',
            '--name', 'Reclip',
            '--app-version', '1.0.0',
            '--input', layout.buildDirectory.dir('jpackage-input').get().asFile.absolutePath,
            '--main-jar', tasks.named('jar').get().archiveFileName.get(),
            '--main-class', 'com.kerim.reclip.app.Launcher',
            '--icon', layout.buildDirectory.file('icon/Reclip.icns').get().asFile.absolutePath,
            '--mac-package-identifier', 'com.kerim.reclip',
            '--java-options', '--enable-native-access=ALL-UNNAMED',
            '--dest', layout.buildDirectory.dir('dist').get().asFile.absolutePath
}

tasks.register('packageMacDmg', Exec) {
    dependsOn tasks.named('packageMacApp')
    commandLine 'jpackage',
            '--type', 'dmg',
            '--name', 'Reclip',
            '--app-version', '1.0.0',
            '--app-image', layout.buildDirectory.dir('dist/Reclip.app').get().asFile.absolutePath,
            '--icon', layout.buildDirectory.file('icon/Reclip.icns').get().asFile.absolutePath,
            '--dest', layout.buildDirectory.dir('dist').get().asFile.absolutePath
}

tasks.register('generateWinIcon') {
    def iconSource = file('Smoked-glass clipboard with curved arrow.png')
    def icoOutput = layout.buildDirectory.file('icon/Reclip.ico')
    inputs.file(iconSource)
    outputs.file(icoOutput)

    doLast {
        def sourceImg = javax.imageio.ImageIO.read(iconSource)
        if (sourceImg == null) {
            throw new GradleException("Unable to read icon image: ${iconSource}")
        }
        def sizes = [16, 24, 32, 48, 64, 128, 256]
        def pngFrames = sizes.collect { int sz ->
            def scaled = new java.awt.image.BufferedImage(sz, sz, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def g = scaled.createGraphics()
            try {
                g.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                        java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                g.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING,
                        java.awt.RenderingHints.VALUE_RENDER_QUALITY)
                g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING,
                        java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
                g.drawImage(sourceImg, 0, 0, sz, sz, null)
            } finally {
                g.dispose()
            }
            def baos = new java.io.ByteArrayOutputStream()
            javax.imageio.ImageIO.write(scaled, 'png', baos)
            baos.toByteArray()
        }

        int headerBytes = 6 + (16 * pngFrames.size())
        int totalBytes = headerBytes + (int) pngFrames.sum { byte[] b -> b.length }
        def buffer = java.nio.ByteBuffer.allocate(totalBytes).order(java.nio.ByteOrder.LITTLE_ENDIAN)
        buffer.putShort((short) 0)
        buffer.putShort((short) 1)
        buffer.putShort((short) pngFrames.size())

        int offset = headerBytes
        sizes.eachWithIndex { int sz, int idx ->
            byte[] data = pngFrames[idx]
            buffer.put((byte) (sz >= 256 ? 0 : sz))
            buffer.put((byte) (sz >= 256 ? 0 : sz))
            buffer.put((byte) 0)
            buffer.put((byte) 0)
            buffer.putShort((short) 1)
            buffer.putShort((short) 32)
            buffer.putInt(data.length)
            buffer.putInt(offset)
            offset += data.length
        }
        pngFrames.each { byte[] data -> buffer.put(data) }

        def icoFile = icoOutput.get().asFile
        icoFile.parentFile.mkdirs()
        java.nio.file.Files.write(icoFile.toPath(), buffer.array())
    }
}

tasks.register('packageWinApp', Exec) {
    dependsOn tasks.named('prepareJpackageInput'), tasks.named('generateWinIcon')
    doFirst {
        def appOut = layout.buildDirectory.dir('dist/Reclip').get().asFile
        if (appOut.exists()) {
            delete appOut
        }
        layout.buildDirectory.dir('dist').get().asFile.mkdirs()
    }
    commandLine 'jpackage',
            '--type', 'app-image',
            '--name', 'Reclip',
            '--app-version', '1.0.0',
            '--vendor', 'Reclip',
            '--input', layout.buildDirectory.dir('jpackage-input').get().asFile.absolutePath,
            '--main-jar', tasks.named('jar').get().archiveFileName.get(),
            '--main-class', 'com.kerim.reclip.app.Launcher',
            '--icon', layout.buildDirectory.file('icon/Reclip.ico').get().asFile.absolutePath,
            '--java-options', '--enable-native-access=ALL-UNNAMED',
            '--dest', layout.buildDirectory.dir('dist').get().asFile.absolutePath
}

tasks.register('ensureWixToolset') {
    def wixCacheDir = new File(gradle.gradleUserHomeDir, 'caches/reclip-wix/wix314')
    outputs.dir(wixCacheDir)

    doLast {
        def onPath = ['wix.exe', 'candle.exe'].any { tool ->
            System.getenv('PATH')?.split(File.pathSeparator)?.any { dir ->
                dir && new File(dir, tool).isFile()
            }
        }
        if (onPath || new File(wixCacheDir, 'candle.exe').isFile()) {
            return
        }
        wixCacheDir.mkdirs()
        def localBuildWix = layout.buildDirectory.dir('tools/wix').get().asFile
        if (new File(localBuildWix, 'candle.exe').isFile()) {
            project.copy {
                from localBuildWix
                into wixCacheDir
            }
            return
        }
        def zipFile = new File(wixCacheDir, 'wix314-binaries.zip')
        logger.lifecycle('Downloading portable WiX Toolset 3.14.1 for jpackage Windows installer...')
        new URI('https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip')
                .toURL()
                .withInputStream { input ->
                    java.nio.file.Files.copy(input, zipFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
        project.copy {
            from zipTree(zipFile)
            into wixCacheDir
        }
        zipFile.delete()
    }
}

tasks.register('packageWinExe', Exec) {
    dependsOn tasks.named('packageWinApp'), tasks.named('ensureWixToolset')
    doFirst {
        def exeOut = layout.buildDirectory.file('dist/Reclip-1.0.0.exe').get().asFile
        if (exeOut.exists()) {
            delete exeOut
        }
        def wixCacheDir = new File(gradle.gradleUserHomeDir, 'caches/reclip-wix/wix314')
        if (wixCacheDir.isDirectory()) {
            def currentPath = System.getenv('PATH') ?: ''
            environment 'PATH', "${wixCacheDir.absolutePath}${File.pathSeparator}${currentPath}"
        }
    }
    commandLine 'jpackage',
            '--type', 'exe',
            '--name', 'Reclip',
            '--app-version', '1.0.0',
            '--vendor', 'Reclip',
            '--app-image', layout.buildDirectory.dir('dist/Reclip').get().asFile.absolutePath,
            '--icon', layout.buildDirectory.file('icon/Reclip.ico').get().asFile.absolutePath,
            '--win-upgrade-uuid', '8f4c9b2a-51d7-4e63-9c12-7a3b8d90e1f4',
            '--win-per-user-install',
            '--win-dir-chooser',
            '--win-menu',
            '--win-shortcut',
            '--dest', layout.buildDirectory.dir('dist').get().asFile.absolutePath
}
