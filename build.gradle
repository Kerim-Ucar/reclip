plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.kerim'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = '25'
    modules = ['javafx.controls']
}

application {
    mainClass = 'com.kerim.reclip.app.ReclipApp'
    applicationDefaultJvmArgs = [
            '--enable-native-access=ALL-UNNAMED',
            '--enable-native-access=javafx.graphics'
    ]
}

dependencies {
    implementation 'com.github.kwhat:jnativehook:2.2.2'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

def appBundleVersion = '1.1.0'
def runtimeModules = 'java.base,java.desktop,java.logging,jdk.jfr'
def jvmBaseOptions = [
        '--enable-native-access=ALL-UNNAMED',
        '-XX:+UseSerialGC',
        '-Xms8m',
        '-Xmx60m',
        '-XX:+TieredCompilation',
        '-XX:TieredStopAtLevel=1',
        '-Dprism.targetvram=16M',
        '-Dprism.maxvram=64M'
]

def jdk25HomeProvider = javaToolchains.launcherFor(java.toolchain).map { it.metadata.installationPath.asFile }

tasks.register('prepareJpackageInput', Sync) {
    dependsOn tasks.named('jar')
    from tasks.named('jar').get().archiveFile
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('jpackage-input')
}

tasks.register('buildMacRuntime', Exec) {
    def runtimeDir = layout.buildDirectory.dir('mac-runtime')
    outputs.dir(runtimeDir)
    doFirst {
        delete runtimeDir.get().asFile
        def jlinkBin = new File(jdk25HomeProvider.get(), 'bin/jlink')
        commandLine jlinkBin.absolutePath,
                '--add-modules', runtimeModules,
                '--strip-debug',
                '--no-header-files',
                '--no-man-pages',
                '--output', runtimeDir.get().asFile.absolutePath
    }
}

tasks.register('packageMacApp', Exec) {
    dependsOn tasks.named('prepareJpackageInput'), tasks.named('buildMacRuntime')
    doFirst {
        def iconSource = file('Smoked-glass clipboard with curved arrow.png')
        def iconsetDir = layout.buildDirectory.dir('icon/Reclip.iconset').get().asFile
        def icnsFile = layout.buildDirectory.file('icon/Reclip.icns').get().asFile
        def distDir = layout.buildDirectory.dir('dist').get().asFile
        delete distDir
        iconsetDir.mkdirs()

        [16, 32, 128, 256, 512].each { size ->
            new ProcessBuilder('sips', '-z', "${size}", "${size}", iconSource.absolutePath,
                    '--out', new File(iconsetDir, "icon_${size}x${size}.png").absolutePath)
                    .inheritIO().start().waitFor()
            def retina = size * 2
            new ProcessBuilder('sips', '-z', "${retina}", "${retina}", iconSource.absolutePath,
                    '--out', new File(iconsetDir, "icon_${size}x${size}@2x.png").absolutePath)
                    .inheritIO().start().waitFor()
        }
        def iconResult = new ProcessBuilder('iconutil', '-c', 'icns', iconsetDir.absolutePath, '-o', icnsFile.absolutePath)
                .inheritIO().start().waitFor()
        if (iconResult != 0) {
            throw new GradleException("iconutil failed with exit code ${iconResult}")
        }

        def jpackageBin = new File(jdk25HomeProvider.get(), 'bin/jpackage')
        def cmd = [
                jpackageBin.absolutePath,
                '--type', 'app-image',
                '--name', 'Reclip',
                '--app-version', appBundleVersion,
                '--input', layout.buildDirectory.dir('jpackage-input').get().asFile.absolutePath,
                '--runtime-image', layout.buildDirectory.dir('mac-runtime').get().asFile.absolutePath,
                '--main-jar', tasks.named('jar').get().archiveFileName.get(),
                '--main-class', 'com.kerim.reclip.app.Launcher',
                '--icon', icnsFile.absolutePath,
                '--mac-package-identifier', 'com.kerim.reclip'
        ]
        jvmBaseOptions.each { opt ->
            cmd.addAll(['--java-options', opt])
        }
        cmd.addAll([
                '--java-options', '-XX:AOTCache=$APPDIR/reclip.aot',
                '--java-options', '-XX:AOTMode=auto',
                '--dest', distDir.absolutePath
        ])
        commandLine cmd
    }

    doLast {
        def appBundle = layout.buildDirectory.dir('dist/Reclip.app').get().asFile
        def appDir = new File(appBundle, 'Contents/app')
        def cfgFile = new File(appDir, 'Reclip.cfg')
        def aotFile = new File(appDir, 'reclip.aot')
        def runtimeJava = layout.buildDirectory.file('mac-runtime/bin/java').get().asFile

        def cpEntries = []
        cfgFile.eachLine('UTF-8') { line ->
            def trimmed = line.trim()
            if (trimmed.startsWith('app.mainjar=')) {
                cpEntries.add(trimmed.substring('app.mainjar='.length()).replace('$APPDIR', appDir.absolutePath))
            } else if (trimmed.startsWith('app.classpath=')) {
                cpEntries.add(trimmed.substring('app.classpath='.length()).replace('$APPDIR', appDir.absolutePath))
            }
        }
        if (cpEntries.isEmpty()) {
            throw new GradleException("Could not parse classpath entries from ${cfgFile}")
        }

        def trainCmd = [runtimeJava.absolutePath]
        trainCmd.addAll(jvmBaseOptions)
        trainCmd.addAll([
                '-Dreclip.aot.train=true',
                "-XX:AOTCacheOutput=${aotFile.absolutePath}".toString(),
                '-cp', cpEntries.join(File.pathSeparator),
                'com.kerim.reclip.app.Launcher'
        ])
        def trainResult = new ProcessBuilder(trainCmd.collect { it.toString() }).inheritIO().start().waitFor()
        if (trainResult != 0 || !aotFile.isFile()) {
            throw new GradleException("JDK 25 AOT cache generation failed (exit=${trainResult}, fileExists=${aotFile.isFile()})")
        }

        def bundledBinDir = new File(appBundle, 'Contents/runtime/Contents/Home/bin')
        if (bundledBinDir.exists()) {
            delete bundledBinDir
        }

        def signResult = new ProcessBuilder('codesign', '--force', '--deep', '--sign', '-', appBundle.absolutePath)
                .inheritIO().start().waitFor()
        if (signResult != 0) {
            throw new GradleException("codesign failed with exit code ${signResult}")
        }
    }
}

tasks.register('packageMacDmg', Exec) {
    dependsOn tasks.named('packageMacApp')
    doFirst {
        def jpackageBin = new File(jdk25HomeProvider.get(), 'bin/jpackage')
        commandLine jpackageBin.absolutePath,
                '--type', 'dmg',
                '--name', 'Reclip',
                '--app-version', appBundleVersion,
                '--app-image', layout.buildDirectory.dir('dist/Reclip.app').get().asFile.absolutePath,
                '--icon', layout.buildDirectory.file('icon/Reclip.icns').get().asFile.absolutePath,
                '--dest', layout.buildDirectory.dir('dist').get().asFile.absolutePath
    }
}

tasks.register('generateWinIcon') {
    def iconSource = file('Smoked-glass clipboard with curved arrow.png')
    def icoOutput = layout.buildDirectory.file('icon/Reclip.ico')
    inputs.file(iconSource)
    outputs.file(icoOutput)

    doLast {
        def sourceImg = javax.imageio.ImageIO.read(iconSource)
        if (sourceImg == null) {
            throw new GradleException("Unable to read icon image: ${iconSource}")
        }
        def sizes = [16, 24, 32, 48, 64, 128, 256]
        def pngFrames = sizes.collect { int sz ->
            def scaled = new java.awt.image.BufferedImage(sz, sz, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def g = scaled.createGraphics()
            try {
                g.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                        java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                g.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING,
                        java.awt.RenderingHints.VALUE_RENDER_QUALITY)
                g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING,
                        java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
                g.drawImage(sourceImg, 0, 0, sz, sz, null)
            } finally {
                g.dispose()
            }
            def baos = new java.io.ByteArrayOutputStream()
            javax.imageio.ImageIO.write(scaled, 'png', baos)
            baos.toByteArray()
        }

        int headerBytes = 6 + (16 * pngFrames.size())
        int totalBytes = headerBytes + (int) pngFrames.sum { byte[] b -> b.length }
        def buffer = java.nio.ByteBuffer.allocate(totalBytes).order(java.nio.ByteOrder.LITTLE_ENDIAN)
        buffer.putShort((short) 0)
        buffer.putShort((short) 1)
        buffer.putShort((short) pngFrames.size())

        int offset = headerBytes
        sizes.eachWithIndex { int sz, int idx ->
            byte[] data = pngFrames[idx]
            buffer.put((byte) (sz >= 256 ? 0 : sz))
            buffer.put((byte) (sz >= 256 ? 0 : sz))
            buffer.put((byte) 0)
            buffer.put((byte) 0)
            buffer.putShort((short) 1)
            buffer.putShort((short) 32)
            buffer.putInt(data.length)
            buffer.putInt(offset)
            offset += data.length
        }
        pngFrames.each { byte[] data -> buffer.put(data) }

        def icoFile = icoOutput.get().asFile
        icoFile.parentFile.mkdirs()
        java.nio.file.Files.write(icoFile.toPath(), buffer.array())
    }
}

tasks.register('buildWinRuntime', Exec) {
    def runtimeDir = layout.buildDirectory.dir('win-runtime')
    outputs.dir(runtimeDir)
    doFirst {
        delete runtimeDir.get().asFile
        def jlinkBin = new File(jdk25HomeProvider.get(), 'bin/jlink.exe')
        commandLine jlinkBin.absolutePath,
                '--add-modules', runtimeModules,
                '--strip-debug',
                '--no-header-files',
                '--no-man-pages',
                '--output', runtimeDir.get().asFile.absolutePath
    }
}

tasks.register('packageWinApp', Exec) {
    dependsOn tasks.named('prepareJpackageInput'), tasks.named('generateWinIcon'), tasks.named('buildWinRuntime')
    doFirst {
        def appOut = layout.buildDirectory.dir('dist/Reclip').get().asFile
        if (appOut.exists()) {
            delete appOut
        }
        layout.buildDirectory.dir('dist').get().asFile.mkdirs()

        def jpackageBin = new File(jdk25HomeProvider.get(), 'bin/jpackage.exe')
        def cmd = [
                jpackageBin.absolutePath,
                '--type', 'app-image',
                '--name', 'Reclip',
                '--app-version', appBundleVersion,
                '--vendor', 'Reclip',
                '--input', layout.buildDirectory.dir('jpackage-input').get().asFile.absolutePath,
                '--runtime-image', layout.buildDirectory.dir('win-runtime').get().asFile.absolutePath,
                '--main-jar', tasks.named('jar').get().archiveFileName.get(),
                '--main-class', 'com.kerim.reclip.app.Launcher',
                '--icon', layout.buildDirectory.file('icon/Reclip.ico').get().asFile.absolutePath
        ]
        jvmBaseOptions.each { opt ->
            cmd.addAll(['--java-options', opt])
        }
        cmd.addAll([
                '--java-options', '-XX:AOTCache=$APPDIR/reclip.aot',
                '--java-options', '-XX:AOTMode=auto',
                '--dest', layout.buildDirectory.dir('dist').get().asFile.absolutePath
        ])
        commandLine cmd
    }

    doLast {
        def appOut = layout.buildDirectory.dir('dist/Reclip').get().asFile
        def appDir = new File(appOut, 'app')
        def cfgFile = new File(appDir, 'Reclip.cfg')
        def aotFile = new File(appDir, 'reclip.aot')
        def runtimeJava = layout.buildDirectory.file('win-runtime/bin/java.exe').get().asFile

        def cpEntries = []
        cfgFile.eachLine('UTF-8') { line ->
            def trimmed = line.trim()
            if (trimmed.startsWith('app.mainjar=')) {
                cpEntries.add(trimmed.substring('app.mainjar='.length()).replace('$APPDIR', appDir.absolutePath))
            } else if (trimmed.startsWith('app.classpath=')) {
                cpEntries.add(trimmed.substring('app.classpath='.length()).replace('$APPDIR', appDir.absolutePath))
            }
        }
        if (cpEntries.isEmpty()) {
            throw new GradleException("Could not parse classpath entries from ${cfgFile}")
        }

        def trainCmd = [runtimeJava.absolutePath]
        trainCmd.addAll(jvmBaseOptions)
        trainCmd.addAll([
                '-Dreclip.aot.train=true',
                "-XX:AOTCacheOutput=${aotFile.absolutePath}".toString(),
                '-cp', cpEntries.join(File.pathSeparator),
                'com.kerim.reclip.app.Launcher'
        ])
        def trainResult = new ProcessBuilder(trainCmd.collect { it.toString() }).inheritIO().start().waitFor()
        if (trainResult != 0 || !aotFile.isFile()) {
            throw new GradleException("JDK 25 AOT cache generation failed (exit=${trainResult}, fileExists=${aotFile.isFile()})")
        }
    }
}

tasks.register('ensureWixToolset') {
    def wixCacheDir = new File(gradle.gradleUserHomeDir, 'caches/reclip-wix/wix314')
    outputs.dir(wixCacheDir)

    doLast {
        def onPath = ['wix.exe', 'candle.exe'].any { tool ->
            System.getenv('PATH')?.split(File.pathSeparator)?.any { dir ->
                dir && new File(dir, tool).isFile()
            }
        }
        if (onPath || new File(wixCacheDir, 'candle.exe').isFile()) {
            return
        }
        wixCacheDir.mkdirs()
        def localBuildWix = layout.buildDirectory.dir('tools/wix').get().asFile
        if (new File(localBuildWix, 'candle.exe').isFile()) {
            project.copy {
                from localBuildWix
                into wixCacheDir
            }
            return
        }
        def zipFile = new File(wixCacheDir, 'wix314-binaries.zip')
        logger.lifecycle('Downloading portable WiX Toolset 3.14.1 for jpackage Windows installer...')
        new URI('https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip')
                .toURL()
                .withInputStream { input ->
                    java.nio.file.Files.copy(input, zipFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
        project.copy {
            from zipTree(zipFile)
            into wixCacheDir
        }
        zipFile.delete()
    }
}

tasks.register('prepareWinMsiResources') {
    def resourceDir = layout.buildDirectory.dir('jpackage-win-resources')
    outputs.dir(resourceDir)

    doLast {
        def outDir = resourceDir.get().asFile
        delete outDir
        outDir.mkdirs()

        def extractTmp = new File(outDir, 'extract-tmp')
        def jimageBin = new File(jdk25HomeProvider.get(), 'bin/jimage.exe')
        def modulesFile = new File(jdk25HomeProvider.get(), 'lib/modules')
        def extractProc = new ProcessBuilder(
                jimageBin.absolutePath,
                'extract',
                '--include', 'regex:.*jpackage/internal/resources/main\\.wxs',
                '--dir', extractTmp.absolutePath,
                modulesFile.absolutePath
        ).inheritIO().start()
        if (extractProc.waitFor() != 0) {
            throw new GradleException('Failed to extract jpackage main.wxs template via jimage')
        }

        def extractedWxs = new File(extractTmp, 'jdk.jpackage/jdk/jpackage/internal/resources/main.wxs')
        if (!extractedWxs.isFile()) {
            throw new GradleException("Extracted main.wxs not found at ${extractedWxs}")
        }
        String content = extractedWxs.getText('UTF-8')
        String patched = content
                .replace('Id="$(var.JpProductCode)"', 'Id="*"')
                .replace('IncludeMaximum="$(var.JpUpgradeVersionOnlyDetectUpgrade)"', 'IncludeMaximum="yes"')
        if (patched == content) {
            throw new GradleException('Failed to patch jpackage main.wxs for same-version upgrades')
        }
        new File(outDir, 'main.wxs').setText(patched, 'UTF-8')
        delete extractTmp
    }
}

tasks.register('packageWinExe', Exec) {
    dependsOn tasks.named('packageWinApp'), tasks.named('ensureWixToolset'), tasks.named('prepareWinMsiResources')
    doFirst {
        def exeOut = layout.buildDirectory.file("dist/Reclip-${appBundleVersion}.exe").get().asFile
        if (exeOut.exists()) {
            delete exeOut
        }
        def wixCacheDir = new File(gradle.gradleUserHomeDir, 'caches/reclip-wix/wix314')
        if (wixCacheDir.isDirectory()) {
            def currentPath = System.getenv('PATH') ?: ''
            environment 'PATH', "${wixCacheDir.absolutePath}${File.pathSeparator}${currentPath}"
        }
        def jpackageBin = new File(jdk25HomeProvider.get(), 'bin/jpackage.exe')
        commandLine jpackageBin.absolutePath,
                '--type', 'exe',
                '--name', 'Reclip',
                '--app-version', appBundleVersion,
                '--vendor', 'Reclip',
                '--app-image', layout.buildDirectory.dir('dist/Reclip').get().asFile.absolutePath,
                '--icon', layout.buildDirectory.file('icon/Reclip.ico').get().asFile.absolutePath,
                '--resource-dir', layout.buildDirectory.dir('jpackage-win-resources').get().asFile.absolutePath,
                '--win-upgrade-uuid', '8f4c9b2a-51d7-4e63-9c12-7a3b8d90e1f4',
                '--win-per-user-install',
                '--win-dir-chooser',
                '--win-menu',
                '--win-menu-group', 'Reclip',
                '--win-shortcut',
                '--dest', layout.buildDirectory.dir('dist').get().asFile.absolutePath
    }
}
